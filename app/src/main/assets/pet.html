<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #stage {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #pet {
    width: 90%;
    height: 94%;
    transform-origin: 50% 100%;
    animation: float 3.2s ease-in-out infinite;
  }
  #pet.jump { animation: jump 0.55s ease-out; }
  #pet.angry .ear-l { animation: earAngryL 0.8s ease-out forwards; }
  #pet.angry .ear-r { animation: earAngryR 0.8s ease-out forwards; }
  #pet.angry #mouth { d: path("M92,146 Q100,138 108,146"); }
  #pet.angry #browL { opacity: 1; transform: rotate(14deg); }
  #pet.angry #browR { opacity: 1; transform: rotate(-14deg); }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); }
    30% { transform: translateY(-26px) scale(0.98, 1.02); }
    60% { transform: translateY(0) scale(1.05, 0.94); }
    80% { transform: translateY(-8px) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.08); }
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
  @keyframes earTwitch {
    0%, 100% { transform: rotate(0deg); }
    90% { transform: rotate(0deg); }
    93% { transform: rotate(-8deg); }
    96% { transform: rotate(0deg); }
  }
  @keyframes earAngryL {
    0% { transform: rotate(0); }
    100% { transform: rotate(-16deg); }
  }
  @keyframes earAngryR {
    0% { transform: rotate(0); }
    100% { transform: rotate(16deg); }
  }
  @keyframes heartFloat {
    0% { transform: translateY(0) scale(0.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-80px) scale(1.15); opacity: 0; }
  }
  #tail { transform-origin: 132px 182px; animation: tailWag 1.6s ease-in-out infinite; }
  .eye { transform-origin: center; animation: blink 4.2s infinite; }
  .ear-l { transform-origin: 74px 68px; animation: earTwitch 5.5s ease-in-out infinite; }
  .ear-r { transform-origin: 126px 68px; animation: earTwitch 6.3s ease-in-out infinite; }
  #browL, #browR { opacity: 0; transition: transform 0.3s, opacity 0.3s; }
  #browL { transform-origin: 79px 104px; }
  #browR { transform-origin: 121px 104px; }
  #blush { opacity: 0.45; transition: opacity 0.3s; }
  #pet.flush #blush { opacity: 0.95; }

  #bubble {
    position: absolute;
    left: 50%; top: 2%;
    transform: translateX(-50%);
    max-width: 96%;
    background: rgba(255, 255, 255, 0.96);
    border: 2px solid #d8d3e8;
    border-radius: 16px;
    padding: 10px 14px;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    color: #3a3450;
    white-space: normal;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  #bubble.show { opacity: 1; }
  #hearts { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .heart {
    position: absolute;
    font-size: 24px;
    animation: heartFloat 1.4s ease-out forwards;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <svg id="pet" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="faceGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#FDF1EB"/>
      </radialGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F7F2FA"/>
      </linearGradient>
    </defs>

    <!-- 大尾巴 -->
    <g id="tail">
      <path d="M130,185 Q178,180 180,128 Q180,100 156,96 Q142,93 138,112 Q132,140 126,160 Q122,175 126,185 Z"
            fill="#FFFFFF" stroke="#EAE4F2" stroke-width="1.6"/>
      <path d="M152,116 Q146,138 138,158" fill="none" stroke="#EAE4F2" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- 狐耳（左） -->
    <g class="ear-l">
      <path d="M82,70 Q62,26 42,40 Q34,48 44,62 Q54,74 66,80 Z"
            fill="#FFFFFF" stroke="#EAE4F2" stroke-width="1.6"/>
      <path d="M74,66 Q60,40 50,48 Q46,52 53,62 Q60,70 68,74 Z"
            fill="#F6C0CE"/>
    </g>
    <!-- 狐耳（右） -->
    <g class="ear-r">
      <path d="M118,70 Q138,26 158,40 Q166,48 156,62 Q146,74 134,80 Z"
            fill="#FFFFFF" stroke="#EAE4F2" stroke-width="1.6"/>
      <path d="M126,66 Q140,40 150,48 Q154,52 147,62 Q140,70 132,74 Z"
            fill="#F6C0CE"/>
    </g>

    <!-- 身体（坐姿） -->
    <path d="M62,152 Q56,190 68,204 Q82,214 100,214 Q118,214 132,204 Q144,190 138,152 Z"
          fill="url(#bodyGrad)" stroke="#EAE4F2" stroke-width="1.6"/>
    <!-- 肚皮 -->
    <ellipse cx="100" cy="190" rx="26" ry="20" fill="#FFF9F5"/>
    <!-- 前爪 -->
    <ellipse cx="79" cy="207" rx="11" ry="9" fill="#FFFFFF" stroke="#EAE4F2" stroke-width="1.3"/>
    <ellipse cx="121" cy="207" rx="11" ry="9" fill="#FFFFFF" stroke="#EAE4F2" stroke-width="1.3"/>
    <path d="M75,210 L75,204 M79,211 L79,205 M83,210 L83,204" stroke="#E3DCF0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M117,210 L117,204 M121,211 L121,205 M125,210 L125,204" stroke="#E3DCF0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 头 -->
    <ellipse cx="100" cy="110" rx="46" ry="42" fill="url(#faceGrad)"/>
    <!-- 头顶毛撮 -->
    <path d="M88,72 Q94,58 100,64 Q106,58 112,72 Q106,66 100,68 Q94,66 88,72 Z"
          fill="#FFFFFF" stroke="#EAE4F2" stroke-width="1.2"/>

    <!-- 眉毛（生气时显示） -->
    <line id="browL" x1="70" y1="106" x2="88" y2="103" stroke="#C9A98F" stroke-width="2.6" stroke-linecap="round"/>
    <line id="browR" x1="112" y1="103" x2="130" y2="106" stroke="#C9A98F" stroke-width="2.6" stroke-linecap="round"/>

    <!-- 眼睛 -->
    <g class="eye">
      <ellipse cx="83" cy="118" rx="6.5" ry="8" fill="#D99A3D"/>
      <ellipse cx="83" cy="115" rx="2.4" ry="2.8" fill="#FFFFFF"/>
      <ellipse cx="83" cy="122" rx="1.8" ry="2" fill="#7A4E14"/>
    </g>
    <g class="eye">
      <ellipse cx="117" cy="118" rx="6.5" ry="8" fill="#D99A3D"/>
      <ellipse cx="117" cy="115" rx="2.4" ry="2.8" fill="#FFFFFF"/>
      <ellipse cx="117" cy="122" rx="1.8" ry="2" fill="#7A4E14"/>
    </g>

    <!-- 腮红（眼下外侧） -->
    <g id="blush">
      <ellipse cx="70" cy="134" rx="9.5" ry="5.5" fill="#F8A8B8"/>
      <ellipse cx="130" cy="134" rx="9.5" ry="5.5" fill="#F8A8B8"/>
    </g>

    <!-- 鼻子 -->
    <ellipse cx="100" cy="135" rx="3.6" ry="2.9" fill="#E88A9A"/>
    <!-- 嘴 -->
    <path id="mouth" d="M91,144 Q95,149 100,144 Q105,149 109,144" fill="none" stroke="#B97A4A"
          stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <div id="hearts"></div>
</div>

<script>
(function () {
  var pet = document.getElementById('pet');
  var bubble = document.getElementById('bubble');
  var hearts = document.getElementById('hearts');
  var bubbleTimer = null;
  var angryTimer = null;

  var taps = [
    '嗯？',
    '有事？',
    '戳我干嘛',
    '别闹'
  ];
  var doubles = [
    '耳朵只有你能碰',
    '……记下了',
    '你倒是会挑地方戳'
  ];
  var longs = [
    '属狗的吗',
    '……疼',
    '我记仇了',
    '再按还手了'
  ];

  function say(text) {
    bubble.textContent = text;
    bubble.classList.add('show');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('show');
    }, 1700);
  }

  function spawnHeart() {
    var h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '♥';
    h.style.left = (30 + Math.random() * 40) + '%';
    h.style.top = (30 + Math.random() * 15) + '%';
    h.style.color = ['#F48FB1', '#F06292', '#FF8A80'][Math.floor(Math.random() * 3)];
    hearts.appendChild(h);
    setTimeout(function () { h.remove(); }, 1500);
  }

  function onTap() {
    pet.classList.remove('jump');
    void pet.offsetWidth;
    pet.classList.add('jump');
    say(taps[Math.floor(Math.random() * taps.length)]);
  }

  function onDoubleTap() {
    pet.classList.add('flush');
    say(doubles[Math.floor(Math.random() * doubles.length)]);
    for (var i = 0; i < 3; i++) {
      setTimeout(spawnHeart, i * 180);
    }
    setTimeout(function () { pet.classList.remove('flush'); }, 2200);
  }

  function onLongPress() {
    pet.classList.add('angry');
    say(longs[Math.floor(Math.random() * longs.length)]);
    if (angryTimer) clearTimeout(angryTimer);
    angryTimer = setTimeout(function () {
      pet.classList.remove('angry');
    }, 2500);
  }

  window.petEngine = {
    onTap: onTap,
    onDoubleTap: onDoubleTap,
    onLongPress: onLongPress
  };
})();
</script>
</body>
</html>
