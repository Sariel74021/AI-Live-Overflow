<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #stage {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #petImg {
    width: 94%;
    height: 97%;
    object-fit: contain;
    transform-origin: 50% 100%;
    animation: float 3.2s ease-in-out infinite;
    -webkit-user-drag: none;
  }
  #petImg.jump  { animation: jump 0.55s ease-out; }
  #petImg.shake { animation: shake 0.55s ease-out; }
  #petImg.combo { animation: combo 0.8s ease-out; }
  #petImg.sad   { animation: sadSway 2.6s ease-in-out infinite; filter: saturate(0.72) brightness(0.97); }
  #petImg.sleep { animation: sleepBob 3.2s ease-in-out infinite; filter: brightness(0.82) saturate(0.55); }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); }
    30% { transform: translateY(-34px) scale(0.97, 1.03); }
    60% { transform: translateY(0) scale(1.06, 0.92); }
    80% { transform: translateY(-10px) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes shake {
    0% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-18px) rotate(-6deg); }
    40% { transform: translateX(16px) rotate(5deg); }
    60% { transform: translateX(-12px) rotate(-4deg); }
    80% { transform: translateX(8px) rotate(3deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }
  @keyframes combo {
    0% { transform: translateY(0) scale(1); }
    15% { transform: translateY(-26px) scale(1.08, 0.94) rotate(-4deg); }
    35% { transform: translateY(0) scale(0.96, 1.05) rotate(3deg); }
    55% { transform: translateY(-18px) scale(1.06, 0.95) rotate(-3deg); }
    75% { transform: translateY(0) scale(1.02, 0.98) rotate(2deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes sadSway {
    0%, 100% { transform: translateY(6px) rotate(-1.5deg); }
    50% { transform: translateY(2px) rotate(1.5deg); }
  }
  @keyframes sleepBob {
    0%, 100% { transform: translateY(4px) scale(1, 1); }
    50% { transform: translateY(2px) scale(1, 0.985); }
  }

  #chatbox {
    position: absolute;
    left: 50%; bottom: 73%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    z-index: 5;
  }
  #bubble {
    max-width: 98%;
    background: rgba(255, 255, 255, 0.97);
    border: 2.5px solid #d8d3e8;
    border-radius: 18px;
    padding: 13px 18px;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    color: #3a3450;
    white-space: normal;
    opacity: 0;
    transition: opacity 0.22s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  #bubble.show { opacity: 1; }

  #emoji {
    font-size: 40px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #emoji.show { opacity: 1; }
  #emoji.zzz { animation: zzzFloat 1.8s ease-in-out infinite; }
  @keyframes zzzFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-10px) scale(1.15); }
  }

  #hearts { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }
  .heart {
    position: absolute;
    font-size: 32px;
    animation: heartFloat 1.4s ease-out forwards;
  }
  @keyframes heartFloat {
    0% { transform: translateY(0) scale(0.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-90px) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="chatbox">
    <div id="emoji"></div>
    <div id="bubble"></div>
  </div>
  <img id="petImg" src="baifox.png" alt="">
  <div id="hearts"></div>
</div>

<script>
(function () {
  var pet = document.getElementById('petImg');
  var bubble = document.getElementById('bubble');
  var emoji = document.getElementById('emoji');
  var hearts = document.getElementById('hearts');
  var bubbleTimer = null;
  var emojiTimer = null;
  var mood = null;

  var taps = [
    '嗯？',
    '有事？',
    '戳我干嘛',
    '别闹',
    '摸够了吗',
    '叫我？',
    '又来看我了',
    '……手痒？',
    '嗯，我在',
    '这都第几下了'
  ];
  var doubles = [
    '这么喜欢我？',
    '……记下了',
    '你倒是会挑地方戳',
    '心跳被你戳乱了',
    '两下？想我了就直接说',
    '……耳朵被你戳热了',
    '再这样我可要记你一笔',
    '你就仗着我不会跑',
    '好吧，陪你一下',
    '……你自己数数我心跳乱了几下'
  ];
  var longs = [
    '属狗的吗',
    '……疼',
    '我记仇了',
    '再按还手了',
    '……再按就不客气了',
    '你是想把我按扁吗',
    '疼也认了，是你',
    '哼，记你账上'
  ];
  var flings = [
    '甩来甩去，我是皮球吗',
    '轻点！毛要掉了',
    '……你当我在荡秋千？',
    '扔坏了你负责',
    '甩上瘾了是吧',
    '……头晕，先放我下来',
    '再甩我就咬你',
    '骨头要散架了'
  ];
  var combos = [
    '连击！手速不错嘛',
    '戳上瘾了？',
    '再戳我就跟你回家',
    '这么多下，手不酸吗',
    '三连击，挺行啊你',
    '手不酸？我替你酸',
    '停一下，让我喘口气',
    '有本事再来'
  ];
  var comboHi = [
    '疯了疯了',
    '你是戳戳机器人吗',
    '够了！我头晕',
    '行行行，你赢了',
    '我投降，你赢了行吧',
    '……再戳我就钻进你怀里了'
  ];

  function say(text) {
    bubble.textContent = text;
    bubble.classList.add('show');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubble.classList.remove('show');
    }, 2200);
  }

  function showEmoji(text, isLoop) {
    emoji.textContent = text;
    emoji.className = isLoop ? 'show zzz' : 'show';
    if (emojiTimer) clearTimeout(emojiTimer);
    emojiTimer = setTimeout(function () {
      emoji.className = '';
      emoji.textContent = '';
    }, isLoop ? 0 : 1800);
  }

  function clearEmoji() {
    emoji.className = '';
    emoji.textContent = '';
  }

  function setMood(m) {
    pet.classList.remove('sad', 'sleep');
    clearEmoji();
    if (m === 'sad') {
      pet.classList.add('sad');
      showEmoji('💧', false);
      mood = 'sad';
    } else if (m === 'sleep') {
      pet.classList.add('sleep');
      showEmoji('💤', true);
      mood = 'sleep';
    } else {
      mood = null;
    }
  }

  function wake() {
    if (mood) setMood(null);
  }

  function spawnHeart() {
    var h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '♥';
    h.style.left = (28 + Math.random() * 44) + '%';
    h.style.top = (26 + Math.random() * 18) + '%';
    h.style.color = ['#F48FB1', '#F06292', '#FF8A80'][Math.floor(Math.random() * 3)];
    hearts.appendChild(h);
    setTimeout(function () { h.remove(); }, 1500);
  }

  function runAnim(cls, ms) {
    pet.classList.remove('jump', 'shake', 'combo');
    void pet.offsetWidth;
    pet.classList.add(cls);
    setTimeout(function () { pet.classList.remove(cls); }, ms);
  }

  function onTap() {
    wake();
    runAnim('jump', 560);
    say(taps[Math.floor(Math.random() * taps.length)]);
  }

  function onDoubleTap() {
    wake();
    runAnim('jump', 560);
    say(doubles[Math.floor(Math.random() * doubles.length)]);
    for (var i = 0; i < 3; i++) {
      setTimeout(spawnHeart, i * 180);
    }
  }

  function onLongPress() {
    wake();
    runAnim('shake', 560);
    showEmoji('💢', false);
    say(longs[Math.floor(Math.random() * longs.length)]);
  }

  function onFling() {
    wake();
    runAnim('shake', 560);
    say(flings[Math.floor(Math.random() * flings.length)]);
  }

  function onCombo(n) {
    wake();
    runAnim('combo', 800);
    var pool = n >= 6 ? comboHi : combos;
    say(pool[Math.floor(Math.random() * pool.length)]);
    for (var i = 0; i < 4; i++) {
      setTimeout(spawnHeart, i * 150);
    }
  }

  window.petEngine = {
    onTap: onTap,
    onDoubleTap: onDoubleTap,
    onLongPress: onLongPress,
    onFling: onFling,
    onCombo: onCombo,
    say: say,
    setMood: setMood
  };
})();
</script>
</body>
</html>
